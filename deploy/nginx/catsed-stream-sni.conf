# Variant of catsed-stream.conf for when 443 is shared with other HTTPS sites.
# A front `stream` server peeks at the TLS SNI and routes catsed's hostname to a second
# stream server that terminates TLS; everything else goes to your existing `http {}` servers,
# which must then listen on 127.0.0.1:8443 with `proxy_protocol` instead of on 443.
#
# Needs the stream module with ssl_preread AND stream_realip (`nginx -V` must show
# --with-stream_realip_module); without realip, catsed would see 127.0.0.1 as every client.

stream {
    map $ssl_preread_server_name $catsed_route {
        catsed-you.synology.me  127.0.0.1:8442;   # CATSED_PUBLIC_URL's hostname
        default                 127.0.0.1:8443;   # your other HTTPS sites
    }

    server {
        listen 443;
        ssl_preread    on;
        proxy_pass     $catsed_route;
        proxy_protocol on;
    }

    server {
        listen 127.0.0.1:8442 ssl proxy_protocol;
        set_real_ip_from 127.0.0.1;
        ssl_certificate     /etc/nginx/certs/catsed/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/catsed/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        proxy_pass     192.168.1.10:8080;   # the NAS (NAS_LAN_IP)
        proxy_protocol on;
        proxy_timeout  120s;
    }
}

# In http {}, each other site becomes:
#     listen 127.0.0.1:8443 ssl proxy_protocol;
#     set_real_ip_from 127.0.0.1;
#     real_ip_header proxy_protocol;
