# nginx in front of catsed: an L4 `stream` proxy, NOT an `http` reverse proxy (see ADR 0002).
# Include this at the top level of nginx.conf (outside `http {}`); it needs the stream module
# (OpenWrt: `nginx-mod-stream`).
#
# Use this when catsed has 443 to itself. If 443 is shared with other HTTPS sites, use
# catsed-stream-sni.conf instead.

stream {
    server {
        listen 443 ssl;
        ssl_certificate     /etc/nginx/certs/catsed/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/catsed/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        proxy_pass     192.168.1.10:8080;   # the NAS (NAS_LAN_IP)
        proxy_protocol on;                  # tells catsed the real client IP
        proxy_timeout  120s;                # longer than catsed's 30s heartbeat
    }
}
